[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Furkan", email = "mfdeveci.027@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ml-train = "ml_service.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
